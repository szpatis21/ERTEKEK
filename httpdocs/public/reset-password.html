<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Új jelszó beállítása - Értékek</title>
    <link rel="stylesheet" href="/stylei.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <style>
        .van{    display: flex;
    flex-direction: row;
    align-content: stretch;
    align-items: center;
    justify-content: flex-end;}
        .reset-container { 
            max-width: 400px; margin: 100px auto; padding: 30px; 
            background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 3vh;
        }
.toggle-jelszo{
margin-right: 1%;
    color: orangered;
    position: absolute; cursor: pointer;
}        #alertOk{opacity: 0; display: none;}
        #missingModal{display: none;}
        #alertText{    background: white;
    width: fit-content;
    margin: auto;
    margin-top: -10%;
    padding: 10px;
    border-radius: 10px;}
        .reset-container input { 
            position: relative;
            width: 100%; padding: 12px; 
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; 
        }
        .reset-container button { 
            width: 100%; padding: 12px; background: #ffbd16; color: #fff; 
            font-weight: bold; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s;
        }
        .reset-container button:hover { background: #e0a800; }
    </style>
</head>
<body style="background-color: #f0f2f5; font-family: sans-serif;">

<div class="reset-container">
    <h2 style="color: #333; margin-bottom: 20px;">Új jelszó megadása</h2>
    <p style="font-size: 14px; color: #666; margin-bottom: 20px;">Kérjük, adja meg az e-mail címét és az új jelszót.</p>
    
    <input type="email" id="res-email" placeholder="Regisztrált E-mail cím" required>
    <div class="van">
        <input type="password" id="res-pass1" placeholder="Új jelszó (min. 8 kar., kisbetű, nagybetű, szám)" required>        <span class="material-symbols-rounded toggle-jelszo">visibility</span>
    </div>
    <div class="van">
        <input type="password" id="res-pass2" placeholder="Új jelszó megerősítése" required>        <span class="material-symbols-rounded toggle-jelszo">visibility</span>
    </div>
    
    <button id="res-btn">Mentés és bejelentkezés</button>
</div>

<script type="module">
    import { showAlert } from '/both/alert.js';

    document.getElementById('res-btn').addEventListener('click', async () => {
        const email = document.getElementById('res-email').value.trim();
        const pass1 = document.getElementById('res-pass1').value;
        const pass2 = document.getElementById('res-pass2').value;

        // Kinyerjük a URL-ből a ?token=XYZ részletet
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            showAlert('Hiányzó vagy érvénytelen visszaállítási kód! Kérjük, igényeljen új jelszó-visszaállítást.');
            return;
        }
        if (!email || !pass1 || !pass2) {
            showAlert('Minden mezőt ki kell tölteni!');
            return;
        }
        if (pass1 !== pass2) {
            showAlert('A két megadott jelszó nem egyezik meg!');
            return;
        }

        try {
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token, email: email, newPass: pass1 })
            });
            const data = await response.json();

            if (data.success) {
                showAlert('A jelszó sikeresen frissítve! Átirányítás a bejelentkezéshez...');
                // 3 másodperc múlva átugrik a rendes login oldalra
                setTimeout(() => { window.location.href = '/login.html'; }, 3000);
            } else {
                showAlert(data.message);
            }
        } catch (err) {
            showAlert('Hiba történt a szerverrel való kommunikáció során.');
        }
    });
</script>
<script>
    // Jelszó láthatóságának váltása
    const toggleJelszoGombok = document.querySelectorAll('.toggle-jelszo');

    toggleJelszoGombok.forEach(gomb => {
        gomb.addEventListener('click', function() {
            // Mivel a HTML-ben a span közvetlenül az input után van, így érjük el:
            const inputMezo = this.previousElementSibling;
            
            if (inputMezo.type === 'password') {
                inputMezo.type = 'text';
                this.textContent = 'visibility_off'; // Ikon váltása áthúzott szemre
            } else {
                inputMezo.type = 'password';
                this.textContent = 'visibility'; // Ikon váltása sima szemre
            }
        });
    });
</script>
</body>
</html>
