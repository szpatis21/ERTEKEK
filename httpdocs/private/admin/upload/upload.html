<script>
(function () {
    const MIN_IDO = 1000;
    const MAX_IDO = 5000;
    const indulas = Date.now();
    let eltuntetesElindult = false;

    function loaderEltuntetese() {
        if (eltuntetesElindult) return;
        eltuntetesElindult = true;

        const loader = document.getElementById('ertekek-loader');
        if (!loader) return;

        const eltelt = Date.now() - indulas;
        const varakozas = Math.max(0, MIN_IDO - eltelt);

        setTimeout(() => {
            loader.classList.add('eltunik');

            setTimeout(() => {
                loader.remove();
            }, 650);
        }, varakozas);
    }

    window.addEventListener('load', loaderEltuntetese);
    setTimeout(loaderEltuntetese, MAX_IDO);
})();
</script>

<script>
    document.addEventListener("DOMContentLoaded", () => {
    const itemC = document.querySelector('#lapok');
    const itemD = document.querySelector('#mainart');
    const ertekelesek = document.querySelectorAll("#ertnone");

    // Ellenőrizzük, hogy az elemek léteznek-e
    if (!itemC || !itemD) {
        console.error("Hiba: Az #lapok vagy a #mainart elem nem található!");
        return;
    }
    if (ertekelesek.length === 0) {
        console.error("Hiba: Nem található elem .ertekelesek2 osztállyal!");
        return;
    }

    let kattintasSzamlalo = 0;

    ertekelesek.forEach(elem => {
        elem.addEventListener('click', () => {
            kattintasSzamlalo++;
            const nezetIndex = kattintasSzamlalo % 3;

            if (nezetIndex === 1) {
                // 1. kattintás: Egyik 100%, másik eltűnik
                itemC.style.display = 'flex';
                itemC.style.width = '100%';
                itemD.style.display = 'none';
            } else if (nezetIndex === 2) {
                // 2. kattintás: Másik 100%, egyik eltűnik
                itemC.style.display = 'none';
                itemD.style.display = 'flex';
                itemD.style.width = '100%';
            } else {
                // 3. kattintás: Vissza 50-50%-ra
                itemC.style.display = 'flex';
                itemC.style.width = '50%';
                itemD.style.display = 'flex';
                itemD.style.width = '50%';
            }
        });
    });
});
</script>
